name: Certify Heavy Corpus

# The GENERATED full-input certificate instances (`lake build CertsHeavy`:
# the 784-dim L2 scorecard, dense IBP L∞, CROWN and the conv IBP net; the
# lakefile's CertsHeavy docstring lists the roots) + their three-axiom audit
# (tests/AuditAxiomsHeavy.lean).
#
# Split out of certs.yml 2026-07-12: these are long-running, data-heavy tails
# (peak elaboration memory took down the shared runners, and blueprint.yml builds
# `Certs` too, so ONE heavy module broke three workflows). Long-running corpus
# work gets its own workflow so it can never break the core: this runs on
# pushes that actually touch the heavy files, weekly (drift), and on demand.
# LEAN_NUM_THREADS is capped to bound per-module peak memory on 16GB runners.

# RE-ENABLED 2026-07-26, after the scorecard trim + the conv-module split.
# It was manual-only from 2026-07-12 because measured peaks (ImgsA 39.5 GB,
# IBP 20.2 GB, conv ~38 GB) fit no free 16 GB runner in any configuration —
# 5 failed attempts, documented in planning/archive/certs_heavy_psd_memory.md.
# Every module in CertsHeavy now fits. Verified by running THIS loop cold at
# LEAN_NUM_THREADS=1 on mars: 1260 s wall, max peak 10.91 GB, and the closing
# `lake build CertsHeavy` a 2.9 s no-op — per-module numbers in the build step
# below. The two per-pair LipSDP modules remain OUT of the lib roots (~16 GB
# for a single hS* goal, which no per-image cap reduces) — they were never
# what blocked this workflow.
#
# `paths` is written against the CURRENT layout. The pre-2026-07 filters
# (LeanMlir/Proofs/Certificates/LipschitzCert/Scorecard*.lean, Proofs/ListDot.lean, …)
# were left behind by the Proofs/ bucket refactor and matched NOTHING, so a
# push trigger restored verbatim would silently never fire.
on:
  push:
    branches: [main]
    paths:
      - 'LeanMlir/Proofs/Certificates/LipschitzCert/Scorecard*.lean'
      - 'LeanMlir/Proofs/Certificates/IbpConvScorecard/*.lean'
      - 'LeanMlir/Proofs/Foundation/ListDot.lean'
      - 'LeanMlir/Proofs/Certificates/IntervalBound.lean'
      - 'LeanMlir/Proofs/Certificates/IntervalBoundConv/Basic.lean'
      - 'LeanMlir/Proofs/Certificates/IntervalBoundConv/Q.lean'
      - 'LeanMlir/Proofs/Foundation/GramQ.lean'
      - 'LeanMlir/Proofs/Certificates/CrownBound.lean'
      - 'tests/AuditAxiomsHeavy.lean'
      - 'tests/AxiomAudit.lean'
      - 'lakefile.lean'
      - '.github/workflows/certs-heavy.yml'
      - 'scripts/stats/**'
      # A Lean/Mathlib bump is what can move the per-module memory peaks this job is tuned
      # around; until 2026-09-09 only the fortnightly cron would have noticed one.
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'scripts/gates/check_audit_coverage.py'
      - 'scripts/lib/lean_graph.py'
  schedule:
    # Bi-weekly drift guard: the 1st and 15th at 09:47 UTC. Cron has no native
    # fortnightly, so day-of-month is the usual spelling (~14-16 day spacing).
    # Was weekly (Sunday) until 2026-08-26.
    # ⚠ This is NOT what governs how often this workflow runs. Over the last 30
    # runs the split was 24 push / 5 schedule, so the `paths` filter above is the
    # real cadence — and `lakefile.lean` in it is why: ANY exe added, link-mode
    # change or target rename fires the heavy corpus, none of which touch a
    # certificate. Halving the cron moves 5 runs in 30; dropping `lakefile.lean`
    # would move the other 24. Left in place deliberately — a lakefile change CAN
    # change what `CertsHeavy` builds — but the cost is now written down.
    - cron: '47 6 1,15 * *'   # 1:47 am US Central (CDT; 12:47 am CST) on the 1st and 15th
  workflow_dispatch:

concurrency:
  # A superseded run of the same ref is cancelled; a push burst builds the last commit only.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # ONE elaboration thread. The per-module peaks that justify re-enabling
      # this workflow were all measured at LEAN_NUM_THREADS=1 (max 11.42 GB);
      # at 2 threads two goals are in flight and the peak is an UNMEASURED
      # multiple of that — which is how the 39.5 GB ImgsA measurement that
      # took the runners down was produced in the first place. ~21 min at 1
      # thread on mars against a 350-min budget, so there is no reason to
      # spend the headroom. Re-measure before raising it.
      # The swapfile experiment from the SDP era is gone: 10G fallocate
      # doesn't fit the runner's root partition (failed in 7 s) — use /mnt.
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Audit coverage check (both audits ⊆ their lib roots)
        run: python3 scripts/gates/check_audit_coverage.py

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            !.lake/build/doc
            !.lake/build/doc-data
          # ⚠ This path block must stay BYTE-IDENTICAL across certs.yml, comparator.yml,
          # certs-heavy.yml and blueprint.yml's rolling step: actions/cache hashes the path list
          # into a cache "version", and restore only ever matches entries of the same version.
          # blueprint.yml needs the two exclusions (its doc-gen4 output lives in those dirs);
          # they are no-ops here, and carrying them is what lets blueprint restore `lake-certs-`.
          # Learned 2026-09-09: blueprint run 34384974391 missed BOTH its restores for this
          # reason and built 242 modules cold.
          # Own `lake-heavy-` namespace, RESTORE-ONLY from certs.yml's `lake-certs-`: CertsHeavy's
          # imports subsume the Certs roots, so a certs entry is the warm start this job wants —
          # but the reverse was poison. Until 2026-09-09 this saved as `lake-certs-<hash>-heavy-<id>`;
          # finishing last, it was the newest `lake-certs-` match and what certs.yml/comparator.yml
          # restored, and its module set is different, so their corpus rebuilt every run.
          key: lake-heavy-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            lake-heavy-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            lake-heavy-
            lake-certs-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            lake-certs-

      - name: Serialization loop covers every CertsHeavy root
        # The loop in the next step must name EVERY `CertsHeavy` root or the final
        # `lake build CertsHeavy` co-schedules the unlisted ones. Derived from the lakefile so the
        # invariant is enforced, not remembered (two roots were missing for two months).
        run: |
          set -euo pipefail
          roots=$(awk '/lean_lib «CertsHeavy»/,/\]/' lakefile.lean | grep -oP 'LeanMlir\.Proofs\.Certificates\.\K[A-Za-z0-9_.]+')
          test -n "$roots"
          for r in $roots; do
            grep -qE "(^| )$r( \\\\|; do)\$" .github/workflows/certs-heavy.yml \
              || { echo "::error::CertsHeavy root $r is not in the serialization loop"; exit 1; }
          done
          echo "every CertsHeavy root is in the loop:" $roots

      - name: Build heavy certificate corpus
        run: |
          lake exe cache get || true
          free -h
          # ONE heavy module at a time: Lake 5.0 has no --jobs flag, and its
          # default scheduler elaborates several big modules concurrently, so
          # the runner sees the SUM of their peaks. Sequential per-module
          # invocations serialize them (each call's heavy deps are already
          # built by the previous ones); the final CertsHeavy call is a no-op
          # verification. This loop must list EVERY CertsHeavy module, or the
          # unlisted ones get elaborated together by that final call.
          #
          # Measured per-module peaks after the 2026-07 scorecard trim
          # (LEAN_NUM_THREADS=1, olean deleted, /usr/bin/time -v on mars):
          #   FullImgsA 11.42 GB   FullNets 10.14 GB   IBP 9.19 GB
          #   ConvImgsB  8.63 GB   ConvImgsA 8.43 GB   IBPUncon 8.28 GB
          #   FullImgsB  4.39 GB   Full 3.47 GB  ConvNet 3.10 GB  Conv 2.65 GB
          #   Lean 4.34.0 (2026-09-18, per-module `lake build` under /usr/bin/time -v): the old
          #   ConvImgsA/B pair doubled to 16.11 GB (8.22 on 4.32.2 — 4.34 elaborates a module's
          #   proofs concurrently); then four 2-image chunks ConvImgsA–D at 9.14–9.68 GB.
          #   Since 2026-09-23 each image is ONE `decide +kernel` of an exact-ℚ checker
          #   (Certificates/IntervalBoundConv/Q): ~11 s and 3.6 GB per chunk (lake env lean).
          #   Crown / CrownUncon: UNMEASURED. Both are CertsHeavy roots (lakefile) and were
          #   missing from this loop until 2026-09-09, so the final `lake build CertsHeavy` was
          #   free to elaborate them together — the exact class this loop exists to prevent.
          #   The step above now fails if a root is ever left out again.
          # — max 11.42 GB, ~21 min total, versus ImgsA 39.5 / IBP 20.2 / conv
          # ~38 GB before the trim. IbpConvScorecard was split into
          # Net/ImgsA/ImgsB/aggregate precisely to get it from 14.68 GB (over
          # what a 16 GB runner carries) to 8.6 — peak tracks images per
          # MODULE, since Lean does not reclaim between declarations.
          #
          # NB the per-pair LipSDP modules are still DISABLED (removed from
          # CertsHeavy): their PSD witnesses are ~16 GB for a SINGLE `hS*`
          # goal, which no per-image cap can reduce — see
          # planning/archive/certs_heavy_psd_memory.md. They stay kernel-verified locally.
          for m in LipschitzCert.ScorecardFullNets \
                   LipschitzCert.ScorecardFullImgsA \
                   LipschitzCert.ScorecardFullImgsB \
                   LipschitzCert.ScorecardFull \
                   LipschitzCert.ScorecardIBPData \
                   LipschitzCert.ScorecardIBP \
                   LipschitzCert.ScorecardCrown \
                   LipschitzCert.ScorecardIBPUncon \
                   LipschitzCert.ScorecardCrownUncon \
                   IbpConvScorecard.Net \
                   IbpConvScorecard.ImgsA \
                   IbpConvScorecard.ImgsB \
                   IbpConvScorecard.ImgsC \
                   IbpConvScorecard.ImgsD \
                   IbpConvScorecard.Basic; do
            echo "=== building $m ==="
            free -m | head -2
            lake build LeanMlir.Proofs.Certificates.$m
          done
          lake build CertsHeavy

      - name: Three-axiom closure check (heavy corpus)
        run: |
          set -e
          # `#audit_axioms` (tests/AxiomAudit.lean) is `#print axioms` that ERRORS outside
          # {propext, Classical.choice, Quot.sound} and on a name that does not resolve, so the exit
          # code of `lake env lean` is the whole gate. (Before it, this step grepped `#print axioms`
          # output, and a pipeline that dropped the exit code reported `Proofs.dw_sum_pair`, a
          # constant that never existed, green for eight days from 2026-08-24.)
          # The sed join collapses Lean's wrapped axiom lists to one line, for the counts below
          # and the scorecard's `faithful` lookups.
          lake build tests.AxiomAudit
          set -o pipefail
          if ! out=$(lake env lean tests/AuditAxiomsHeavy.lean 2>&1 | sed ':a;N;$!ba;s/,\n /, /g'); then
            echo "::error::tests/AuditAxiomsHeavy.lean failed — a decl leaves the three-axiom closure, or an #audit_axioms names a constant that does not exist:"
            echo "$out" | grep -E "error" | head -20
            exit 1
          fi
          AX3='(propext|Classical\.choice|Quot\.sound)'
          total=$(echo "$out" | grep -cE "^'.*' (depends on axioms:|does not depend on any axioms)" || true)
          echo "#audit_axioms verdicts: $total"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Three-Axiom Closure — heavy corpus" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **All ${total} heavy-corpus theorems closed under [\`propext\`, \`Classical.choice\`, \`Quot.sound\`]**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full-input scorecards (L2 Tsuzuku, IBP L∞, CROWN, conv IBP): the aggregates state their proved per-image certificates; the measured per-100 counts are in each generated file's header. (Per-pair LipSDP instances kernel-verified locally but CI-disabled — memory; see planning/archive/certs_heavy_psd_memory.md.)" >> $GITHUB_STEP_SUMMARY

      - name: Install scc
        # scc counts code / comment / blank lines per file (Lean's nested `/- -/` included) for
        # scripts/stats/summary.py. Pinned release, checksum-verified.
        run: |
          curl -sSfL -o /tmp/scc.tgz https://github.com/boyter/scc/releases/download/v3.5.0/scc_Linux_x86_64.tar.gz
          echo "6c31f4d0cf3b7a8c5ca910fa4e451949434798f6541ec5dea4b83f4973e13772  /tmp/scc.tgz" | sha256sum -c -
          sudo tar xzf /tmp/scc.tgz -C /usr/local/bin scc

      - name: Declaration / LoC counts (heavy-only files)
        # The 16 proof files certs.yml's table shows as `—` (in CertsHeavy's closure, not Certs'),
        # counted from the environment `lake build CertsHeavy` above produced.
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 scripts/stats/summary.py --decls CertsHeavy --except Certs >> $GITHUB_STEP_SUMMARY
