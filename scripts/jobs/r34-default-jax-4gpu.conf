# ResNet-34 / ImageNet-1k, JAX REFERENCE path, the `default` recipe (the 2018 recipe, 90 epochs), 4 GPUs.
#
#     setsid nohup scripts/supervise.sh r34-default-jax-4gpu >/dev/null 2>&1 &
#
# Recipe = `resnet34ImagenetConfig`, Bag of Tricks at 90 epochs: SGD momentum 0.9, lr 0.1 at 256
# (4 × 64), wd 1e-4 on the conv / dense weights only (no bias decay, `_wd_mask`), cosine with a
# 5-epoch warmup, softmax CE with label smoothing 0.1, random-resized-crop + flip, 224 / 224, zero-γ
# on every block's second BN, BN decay 0.9, bf16. The peer of `r34-default-bf16-4gpu`.
#
# ⭐⭐ 2026-10-19 — THE NEXT LAUNCH IS THE BAG-OF-TRICKS RERUN (not launched; launching needs the
#   user's word). The landed 74.14 (/home/skoonce/r34_2018_jax_2610/, 2026-10-07) decayed every
#   parameter at γ = 1 and BN decay 0.99; the three rows above are training-time changes, so both
#   halves rerun. A FRESH CKPT_BASE below — the 2610 directory holds that run's epoch-90 state.
#
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo, in a directory of their own: pointing CKPT_BASE at the August
# or the 2610 run's would resume its epoch-90 state and finish at once.
RECIPE=default
DEVS="0,1,2,3"
EPOCHS=90
CKPT_BASE=/home/skoonce/r34_bot_jax/resnet34_imagenet
PY_REL=.lake/build/generated_resnet34_imagenet.py    # relative to jax/
# The August run on this box: median 527 s an epoch, eval included (13.3 h over 90).
EPOCH_SECS=530
ETA="~13.3 h for 90 ep on 4x 4060 Ti (median 527 s/epoch incl. eval; the 2026-08 run, /home/skoonce/r34_2018_90ep)"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_r34_default_jax
precheck_r34_default_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  . scripts/lib/precheck.sh; pc_crop "jax/$PY_REL" torchvision bilinear || ok=1   # train crop + resize kernel
  pc_jax_trainer || ok=1
  pc_aug_no_call "jax/$PY_REL" '_randaugment(' "the 2018 recipe has no RandAugment" || ok=1
  grep -q '^    EPOCHS = 90$' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not the 90-epoch trainer"; ok=1; }
  grep -q '^LR = 0.100000$' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not at the 2018 rate 0.1"; ok=1; }
  grep -q 'x = jnp.matmul(x, params\[36\]\[0\].T)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's classifier head is not the fp32 matmul (X3) — re-emit"; ok=1; }
  # ⛔ THE THREE BAG-OF-TRICKS ROWS (2026-10-19), each read off the emitted trainer, not the recipe.
  grep -q 'WD_MASK = _wd_mask(params)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no WD_MASK — it decays every parameter (pre no-bias-decay). Re-emit."; ok=1; }
  grep -q 'momentum=0.9\b' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's BN decay is not 0.9 (the verified side's, and torchvision's)"; ok=1; }
  [ "$(grep -c '^                   jnp.zeros([0-9]*), jnp.zeros([0-9]*)))$' "jax/$PY_REL")" = 16 ] || {
    echo "⛔ jax/$PY_REL does not start 16 block-closing BN γ at 0 (zero-γ) — re-emit."; ok=1; }
  pc_gpu_idle || ok=1
  return $ok
}
