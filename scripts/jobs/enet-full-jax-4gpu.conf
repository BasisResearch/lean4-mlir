# EfficientNet-B0 / ImageNet-1k, JAX REFERENCE path, the `full` recipe (350 epochs), 4 GPUs.
#
#     START_AT=00:00 STOP_AT=08:00 setsid nohup scripts/supervise.sh enet-full-jax-4gpu >/dev/null 2>&1 &
#
# The JAX side of the EfficientNet-B0 pair; the verified side is `enet-default-4gpu`
# (`emarmstfdp64dropdowneps0001bf16`). Recipe = `efficientNetB0ImagenetConfigFull`, TF's
# (planning/imagenet_parity.md §5.3, 2026-09-25; the ⭐ below, 2026-10-12): TF1's RMSProp (ρ 0.9,
# μ 0.9, ε 1e-3 inside the root, mean-square initialised to 1.0, the rate inside the momentum
# buffer) at lr 0.016 on batch 256 (4 × 64), ×0.97 every 2.4 epochs as a staircase on the global
# step with a 5-epoch warmup overriding it, coupled L2 1e-5 off BN γ/β only (`wdDecayBiases`: the
# biases decay, as main.py's set has it), BN ε 1e-3 / decay 0.99, drop-connect 0.2 over i/16,
# classifier dropout 0.2, label smoothing 0.1, AutoAugment, EMA 0.9999 (BN buffers shadowed),
# running-BN eval on all 50,000. bf16.
#
# This reruns the 77.15 reference, which decayed BN and biases, ran timm's i/15 ramp, BN ε 1e-5 and
# a continuous schedule offset by the warmup.
# ⭐ 2026-10-12 (planning/recipe_prep.md §7): the rest of TF TPU EfficientNet's own code, read off
# tensorflow/tpu models/official/efficientnet: TF1's RMSProp with the rate inside the momentum
# buffer (D13), main.py's decay set (every variable but 'batch_normalization' — the biases decay),
# the classifier at U(±1/√1000) (D6), SAME padding on the strided depthwises (D3, a89fa9af),
# autoaugment.py's own geometry (TranslateY (m/10)·250 px, NEAREST, fill 128, TF's posterize),
# TF1's legacy bicubic on every resize, `_decode_and_center_crop` at eval, the eval forward in f32.
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo; a fresh directory, so the retired run is never resumed.
RECIPE=full
DEVS="0,1,2,3"
EPOCHS=350
CKPT_BASE=/home/skoonce/enet_tf350_2612/efficientnet_b0_imagenet   # fresh lineage 2026-10-12 (recipe_prep.md §7): the trainer moved
PY_REL=.lake/build/generated_efficientnet_b0_imagenet_full.py    # relative to jax/
# The book's planning ETA for this tier was ~47 h; unmeasured on the 4060 Ti. The chunk planner
# replaces EPOCH_SECS with the longest epoch it times itself.
EPOCH_SECS=510   # 5,004 steps × 99 ms + the validation (smoke 2026-10-12); the chunk planner replaces it with what it times
ETA="~49 h for 350 ep: SMOKED 2026-10-12 (runs/2026-10-12-enet-jax-smoke/) at 99 ms a 256-row step in the second 100-step epoch (9.9 s train) + ~12 s a validation, at the default arena"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_enet_full_jax
precheck_enet_full_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  . scripts/lib/precheck.sh; pc_crop "jax/$PY_REL" tf-centre tf1-bicubic || ok=1   # TF's sampler + fallback, TF1's legacy bicubic
  pc_jax_trainer || ok=1
  pc_aug_call "jax/$PY_REL" '_autoaugment(img)' "B0's recipe is AutoAugment" || ok=1
  # TF EfficientNet's policy v0 as autoaugment.py applies it (autoAugmentTf, 2026-10-12): its one
  # TranslateY entry in ABSOLUTE pixels at translate_const 250, NEAREST geometry at fill 128.
  grep -qF "('TranslateY',0.8,9)" "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL carries timm's v0 (TranslateYRel) or the default table — it predates autoAugmentTf; re-emit"; ok=1; }
  grep -qF "def _aa_trn(m): return (m/_AA_MAX)*250.0" "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL translates as a fraction of the side, not TF's (m/10)*250 px; re-emit"; ok=1; }
  grep -qF "interpolation='NEAREST'" "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL warps BILINEAR/bicubic, not TF's NEAREST (augNearest); re-emit"; ok=1; }
  # TF1's RMSProp: the rate INSIDE the momentum buffer and a bare `p - b` step (rmspropTf, D13).
  grep -qF "MOMENTUM * b + lr * g / jnp.sqrt(s + EPS)" "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL keeps the rate outside the momentum term — not TF1's ApplyRMSProp (rmspropTf); re-emit"; ok=1; }
  grep -qF "lambda p, b: p - b, params, buf" "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL multiplies lr onto the buffer at the parameter step; re-emit"; ok=1; }
  # main.py's decay set: BN γ/β alone exempt, the biases decay (wdDecayBiases, the structural mask).
  grep -q '^    def _entry(t):' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL masks weight decay by rank (biases exempt), not by TF's 'batch_normalization' filter; re-emit"; ok=1; }
  # The classifier at TF's dense_kernel_initializer (D6).
  grep -qF "scale = 1.0 / jnp.sqrt(1000.0)" "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL inits the classifier Glorot, not U(±1/√1000) (initHeadTfUniform); re-emit"; ok=1; }
  # TF1's legacy bicubic on the train crop AND the eval resize; the eval crop in TF EfficientNet's
  # own arithmetic, timm's protocol kept beside it (PROTOCOL=timm); the eval forward in f32.
  n=$(grep -c 'tf.compat.v1.image.resize_bicubic' "jax/$PY_REL"); [ "$n" -ge 2 ] || {
    echo "⛔ jax/$PY_REL resizes through tf.image.resize ($n legacy calls), not TF1's resize_bicubic (resizeLegacyTf1); re-emit"; ok=1; }
  grep -q 'TF TPU EfficientNet _decode_and_center_crop (evalCropTfEfficientNet)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's eval crop is not TF EfficientNet's _decode_and_center_crop; re-emit"; ok=1; }
  grep -q '^def _imagenet_decode_center_crop_timm' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no timm eval form beside TF's (PROTOCOL=timm scoring); re-emit"; ok=1; }
  grep -qF "eval: f32 forward (evalF32)" "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL validates in bf16 — it predates evalF32; re-emit"; ok=1; }
  pc_aug_no_call "jax/$PY_REL" '_randaugment(' "B0's recipe is AutoAugment only" || ok=1
  grep -q 'WD_MASK = _wd_mask(params)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL decays BN γ/β and biases — it predates wdExcludeNormBias; re-emit"; ok=1; }
  grep -q 'eps=0.001, momentum=0.99)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not at TF's BN ε 1e-3 — it predates 2026-09-25; re-emit"; ok=1; }
  grep -q 'np.floor(_ep / 2.400000)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL decays continuously — not TF's staircase; re-emit"; ok=1; }
  grep -q 'dpkeys\[15\], 0.812500' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL ramps drop-connect over i/15 — not TF's i/16; re-emit"; ok=1; }
  pc_gpu_idle || ok=1
  return $ok
}
