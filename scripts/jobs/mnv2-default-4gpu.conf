# mnv2-default-4gpu.conf — MobileNetV2 / ImageNet-1k, VERIFIED path (Lean → StableHLO → XLA/PJRT), 4 GPUs.
#
#     scripts/supervise.sh mnv2-default-4gpu
#
# The verified peer of `mnv2-full-jax-4gpu`: MobileNetV2 AS TF-SLIM TRAINED IT — the recipe of
# `research/slim/nets/mobilenet/README.md`'s own reproduction command, read with the sources it runs
# (2026-10-12, planning/recipe_prep.md §6; `jax/MainMobilenetV2Imagenet.lean` names the README's line
# beside each value). 4 replicas × 64 = the global 256 (sync-BN over it), 5,004 steps/epoch, 420 epochs
# (the README's "about 700K steps" on 8 clones of 96). The render `emarmstfdp64wxdwdoeps0001bf16`:
#   * TF1's RMSProp (`rmstf`: ρ 0.9, μ 0.9, ε 1.0 inside the root, the mean-square initialised to 1,
#     THE RATE INSIDE THE MOMENTUM TERM — `tf.train.RMSPropOptimizer`'s `ApplyRMSProp`, D13);
#   * coupled L2 4e-5 off BN γ/β, biases AND the 17 depthwise kernels (`wx` + `dw`: slim regularises
#     `conv2d` only, not `separable_conv2d`, D11);
#   * classifier dropout 0.2 (`do`), label smoothing 0.1 (the README's `--label_smoothing`, the
#     render's default α so it carries no `ls` marker), BatchNorm ε 1e-3 baked (`eps0001`) and decay
#     0.997 on the host, the model-EMA shadow at 0.9999 in TF's warmup-corrected form (`ema`, the
#     README's `--moving_average_decay`; the shadow is what is scored), bf16.
# Host side (the driver, `apps/imagenette/MainMobileNetV2Imagenet.lean`): peak 0.12 at 256 (the
# README's 0.045 per 96 images), ×0.98 every 2.5 epochs as a staircase from step 0 with no warmup
# (`mnv2ImagenetRmsSchedule`), TF-slim's truncated-normal σ 0.09 on every kernel and the logits
# (`truncNormalSigma`, variance-matched). Shim side (the `default` shim, from the same config as the
# reference's trainer): slim's inception crop (area ≥ 0.05, aspect 0.75–1.33, 100 attempts, the whole
# image on exhaustion), bilinear resize without antialias, flip, `distort_color` in fast mode
# (brightness ±32/255 then saturation ×0.5–1.5, clipped; gate scripts/gates/color_distort_gate.py),
# the input scaled (x − 0.5) × 2; no AutoAugment, no Mixup. Eval every epoch on running BN, in f32,
# at timm's 224 / 0.875 (slim's own eval — central_crop 0.875 on both sides, then a bilinear resize —
# is disclosed, not run). The retired arm `rmsdp64wxdols0eps0001bf16` (the 71.12 of §6.5, 350 epochs
# at 0.045 / ×0.98 per epoch, no smoothing, no EMA, timm's crop, mean/std, the fan-rule init) differs
# from this one in every item above except the dropout and the BatchNorm constants.
#
# Checkpoint lineage: the variant is in the checkpoint name, so this conf starts fresh and cannot
# resume the 350-epoch run's `…rmsdp64wxdols0eps0001bf16_ckpt_xla.bin`.
#
# ⚠ Measured history (ares, pre-2026-10-12 arms): the 350-epoch `rmsdp64bf16` run COMPLETED 2026-09-12
# in 54 h 13 m (runs/2026-09-10-mnv2-verified-350ep, per-replica BN, 527 s/epoch before the mimalloc
# leak); `rmsdp64wxdols0bf16` sync-BN PROBED 2026-09-25 at 123 ms/step median; SHIM_WORKERS=4 is the
# 2026-09-10 sweep's plateau (runs/2026-09-10-mnv2rms-sweep.tsv: w1 189 / w2..w4 ~96 / w8 124 mean).
# The 2026-10-12 smoke of THIS arm is in ETA.

# ▶ §2c N1: this must equal the second dash-field of the filename. supervise.sh refuses
#   otherwise — the job namespace drifted from the recipe namespace once already.
RECIPE=default
DEVS="0,1,2,3"
EPOCHS=420              # mobilenetv2ImagenetConfig.epochs — the README's ~700K steps of 768
# 2026-10-12 smoke (runs/2026-10-12-mnv2-default-4gpu/): see ETA; the chunk planner replaces
# EPOCH_SECS with the longest epoch it times itself.
EPOCH_SECS=540
ETA="~63 h for 420 ep on 4x 4060 Ti (2026-10-12 smoke, runs/2026-10-12-mnv2-default-4gpu/: med 96 / min 90 / p90 102 ms per 256-row step at w4, starvation 6 ms; 5,004 steps + ~60 s the f32 validation and checkpoint every epoch; the retired arm read 123 ms on 2026-09-25 under timm's bicubic feed)"

CMD=(.lake/build/bin/mobilenetv2-imagenet-verified data)

. "$(dirname "${BASH_SOURCE[0]}")/_box.sh"   # BOX, BOX_PLUG, BOX_PY, BOX_SHIMPY
VARIANT=emarmstfdp64wxdwdoeps0001bf16
SLUG=mobilenetv2in
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  LEAN_MLIR_VARIANT=$VARIANT         # -> verified_mlir/${SLUG}_${VARIANT}_train_step.mlir
  LEAN_MLIR_BATCH=64                 # PER REPLICA, baked into the render
  LEAN_MLIR_EPOCHS=420               # = EPOCHS; the staircase counts epochs, the loop bound follows
  LEAN_MLIR_BASE_LR_U=120000         # 0.12: the README's 0.045 per 96 images at the global 256
  # ⭐ 4 — the 2026-09-10 sweep's plateau on this net (header). ⛔ NOT a fleet-wide constant.
  SHIM_WORKERS=4
  # Loader respawn (2026-09-27): every 10 epochs one shim producer is replaced, round-robin.
  LEAN_MLIR_SHIM_RESPAWN_EPOCHS=10
)
# No LEAN_MLIR_MEM_FRACTION: see runs/2026-10-12-mnv2-default-4gpu/peak_memory.log (the EMA region
# adds one parameter copy, 3.5 M floats, to a render that sits far inside the default arena).

TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs

# ⚠⚠ KEYED TO THE VARIANT. Checkpoints are `<slug>_<variant>_ckpt_xla.bin`, so this MUST move
# with LEAN_MLIR_VARIANT above. Left at another arm's name it would track a file this run never
# writes and supervise.sh would read epoch 0 forever — a run that never advances and never ends.
CKPT_EPOCH_FILE=".lake/build/${SLUG}_${VARIANT}_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_mnv2
# The checks are scripts/lib/precheck.sh's, shared with the other ImageNet confs; each call names
# what it defends. ⛔ The gate before 2026-09-10 hardcoded the **f32** render path, so flipping the
# variant to bf16 left it passing green on an artifact the run does not execute.
precheck_mnv2() {
  . scripts/lib/precheck.sh
  local ok=0
  local shim=jax/.lake/build/generated_mobilenet_v2_imagenet_shim.py
  # TF's sampler (slim's inception crop) without EfficientNet's centre-crop fallback, resized bilinear
  . scripts/lib/precheck.sh; pc_crop "$shim" tf bilinear || ok=1   # train crop + resize kernel
  local mlir="verified_mlir/${SLUG}_${VARIANT}_train_step.mlir"
  pc_box || ok=1

  # ⛔ THE ARM — the env string, the artifact it names and the checkpoint lineage. 314 all-reduces =
  # the sync-BN render (cad811ac; the EMA region adds no collective).
  pc_render "$SLUG" "$VARIANT" 4 314 || ok=1
  pc_ckpt "$SLUG" "$VARIANT" || ok=1
  # The eval graph at the same ε, or the in-training eval refuses at load.
  [ -f "verified_mlir/${SLUG}_fwd_eval_eps0001.mlir" ] || {
    echo "⛔ missing verified_mlir/${SLUG}_fwd_eval_eps0001.mlir"; ok=1; }
  if [ -f "$mlir" ]; then
    # 5 regions [θ|m|v|E] × 158 + 104 BN stats + the dropout mask + 2 data + 5 scalars = 744.
    python3 scripts/gates/train_step_arity.py "$mlir" | grep -v '^✓'; [ "${PIPESTATUS[0]}" = 0 ] || ok=1
    local nargs; nargs="$(sed -n '2p' "$mlir" | grep -o '%[a-zA-Z0-9_]*: tensor<' | wc -l)"
    [ "$nargs" = "744" ] || {
      echo "⛔ $mlir has $nargs operands, not 744 — not the EMA + dropout layout."; ok=1; }
    # ⭐ 2026-10-12, TF-slim's recipe in the render (planning/recipe_prep.md §6): each line is one item.
    grep -q 'rmsBufNextTfF' "$mlir" || {
      echo "⛔ $mlir applies the rate OUTSIDE the momentum term — not TF1's ApplyRMSProp (rmspropTf, D13)."; ok=1; }
    grep -q '%one = stablehlo.constant dense<1.0> : tensor<f32>' "$mlir" || {
      echo "⛔ $mlir has no %one — the TF-placement parameter step reads it."; ok=1; }
    # wx + dw: 105 one-dimensional parameters + 17 depthwise kernels take %wdz (D11)
    [ "$(grep -c 'broadcast_in_dim %wdz' "$mlir")" = "122" ] || {
      echo "⛔ $mlir binds %wdz $(grep -c 'broadcast_in_dim %wdz' "$mlir") times, not 122 — the depthwise kernels still decay (dw, D11)."; ok=1; }
    grep -q 'dense<1.0e-3>' "$mlir" || { echo "⛔ $mlir does not bake BatchNorm ε 1e-3."; ok=1; }
    grep -q 'dense<1.0e-5>' "$mlir" && { echo "⛔ $mlir carries BatchNorm ε 1e-5 — timm's, not slim's."; ok=1; }
    grep -q '%wd = stablehlo.constant dense<0.000040>' "$mlir" || { echo "⛔ $mlir does not bake wd 4e-5."; ok=1; }
    grep -q '%eps = stablehlo.constant dense<1.000000>' "$mlir" || { echo "⛔ $mlir does not bake RMSProp ε 1.0."; ok=1; }
    # label smoothing 0.1 is the render's default α: the cotangent's −α/K = −0.0001 at K = 1000 is
    # present (the retired `ls0` arm has no such constant; `%orho` is 0.1 on both, so α itself is no test)
    grep -q 'dense<-0.000100>' "$mlir" || { echo "⛔ $mlir has no −α/K — the README smooths at 0.1 and this render does not."; ok=1; }
  fi

  # Built against the driver too: the schedule (NetsCore), the init (Train.lean's truncNormalSigma)
  # and the EMA are host-side, so a binary older than any of them runs another recipe.
  pc_exe mobilenetv2-imagenet-verified LeanMlir/Verified/Train.lean LeanMlir/Verified/NetsCore.lean \
    ffi/f32_helpers.c apps/imagenette/MainMobileNetV2Imagenet.lean || ok=1
  pc_pjrt_so || ok=1

  # ⛔ The shim this run streams is a GENERATED artifact in gitignored .lake/build, and a warm
  # cache serves a stale one silently. That is how THIS NET's published 350ep run got
  # labelSmoothing 0.1 three weeks after its source said 0.0.
  pc_jax_box || ok=1
  pc_shim mobilenet_v2_imagenet || ok=1
  pc_aug_no_call "$shim" '_randaugment(' "slim's pipeline has no RandAugment" || ok=1
  pc_aug_no_call "$shim" '_autoaugment(' "slim's pipeline has no AutoAugment" || ok=1
  # ⭐ 2026-10-12, slim's pipeline in the shim (planning/recipe_prep.md §6): each grep is the emitted
  # text of one item; a shim missing any of them is the retired recipe.
  grep -q 'random_brightness(img, 32. / 255.)' "$shim" || { echo "⛔ $shim has no slim brightness ±32/255 (colorDistortSlim) — re-emit"; ok=1; }
  grep -q 'random_saturation(img, 0.5, 1.5)' "$shim" || { echo "⛔ $shim has no slim saturation 0.5–1.5 (colorDistortSlim) — re-emit"; ok=1; }
  grep -q 'random_hue\|random_contrast' "$shim" && { echo "⛔ $shim distorts hue or contrast — the non-fast mode, which slim did not run"; ok=1; }
  grep -q '_MEAN_RGB = tf.constant(\[127.5' "$shim" || { echo "⛔ $shim normalises by the ImageNet mean/std, not slim's (x − 0.5) × 2 (inputScalePm1) — re-emit"; ok=1; }
  grep -q 'area_range=(0.05, 1.0), max_attempts=100' "$shim" || { echo "⛔ $shim's sampler is not slim's (area ≥ 0.05, 100 attempts; cropAreaMin / cropMaxAttempts) — re-emit"; ok=1; }
  grep -q 'aspect_ratio_range=(0.75, 1.33)' "$shim" || { echo "⛔ $shim's sampler is not at slim's aspect (0.75, 1.33) (cropAspectLo/Hi) — re-emit"; ok=1; }
  grep -q 'method=tf.image.ResizeMethod.BILINEAR, antialias=False)\[0\]' "$shim" || { echo "⛔ $shim's train resize is not bilinear without antialias (slim's resize_images) — re-emit"; ok=1; }
  # the ONE antialias=True left is timm's eval form, the protocol this pair is scored at
  [ "$(grep -c 'antialias=True' "$shim")" = "1" ] || { echo "⛔ $shim antialiases a train resize; slim's pipeline does not (resizeAntialias)"; ok=1; }

  pc_env SHIM_WORKERS=4 "see the measured sweep in the header" || ok=1
  pc_env LEAN_MLIR_EPOCHS=420 "the README's length; must equal EPOCHS" || ok=1
  pc_env LEAN_MLIR_BASE_LR_U=120000 "0.12, the README's 0.045 per 96 at the global 256" || ok=1
  pc_env LEAN_MLIR_BATCH=64 "the render's per-replica batch" || ok=1
  # The per-epoch top-1 bitmaps, for the McNemar pairing with the JAX half (scripts/demos/mcnemar.py).
  # PRECHECK runs in the supervisor's shell after RUNDIR is fixed, so the path is the run's own.
  mkdir -p "$RUNDIR/bitmaps"
  ENV_EXTRA+=("LEAN_MLIR_DUMP_CORRECT=$RUNDIR/bitmaps/${SLUG}_${VARIANT}")
  echo "  per-image bitmaps -> $RUNDIR/bitmaps/${SLUG}_${VARIANT}_e{N}.bin (LEAN_MLIR_DUMP_CORRECT)"
  pc_gpu_idle || ok=1
  return $ok
}
