# ConvNeXt-T / ImageNet-1k, JAX REFERENCE path, the `default` recipe — THE OFFICIAL RECIPE (300 epochs,
# batch 4096 as 16 accumulated micro-batches of 256), 4 GPUs.
#
#     setsid nohup scripts/supervise.sh cnx-default-jax-4gpu >/dev/null 2>&1 &
#
# The JAX side of the ConvNeXt-T pair; the verified side is `cnx-default-emabf16-4gpu`
# (`convnextin_emaaccdp16xwxdroperfbf16`, 16 accumulated micro-batches of 4 x 64). Recipe =
# `convNeXtTinyImagenetConfigFull` (jax/Main*.lean), 2026-10-12 (planning/recipe_prep.md §4; ch 8's marker):
# facebookresearch/ConvNeXt `main.py`'s own defaults and its README command — an effective batch of
# 4096 as GRAD_ACCUM 16 micro-batches of 256 (4 x 64; `--batch_size 128 --update_freq 4` on 8 cards
# there, and ConvNeXt has no BatchNorm, so the accumulation is exact), AdamW `--lr 4e-3` at that
# batch, wd 0.05 off norm/bias/LayerScale, the per-STEP warmup over 20 epochs from 0 then the cosine
# floored at `--min_lr 1e-6` (`utils.cosine_scheduler`, per iteration — NOT timm's per-epoch form,
# which is DeiT's and RSB's), NO gradient clip (`--clip_grad` None), Mixup 0.8 or CutMix 1.0 drawn
# per batch at `--mixup_switch_prob 0.5`, RandAugment m9 mstd0.5 inc1 with the geometric fill at
# timm's img_mean, pixel random erasing 0.25, drop-path 0.1, label smoothing 0.1, timm's `ModelEma`
# at 0.9999 CONSTANT from step 0 (`emaWarmup` off; `--model_ema_eval` scores it), bf16 with the head
# in fp32, ConvNeXt `_init_weights` (cnxInit), torchvision's RandomResizedCrop at bicubic, nn.GELU's
# exact x·Φ(x), and the validation forward in f32 (evalF32). 312 optimizer steps an epoch.
# ⚠ Mixup's λ is drawn once per 4096-row effective batch here, once per 256-row micro-batch in the
#   verified shim and once per 128-row per-GPU batch in the official trainer — a variance detail,
#   not a recipe item (the verified conf's header).
#
# This reruns the 81.53 / 95.51 reference (`/home/skoonce/convnext_t300_3060/`, 2026-09-04→09-07,
# 76.5 h on the 3060 box), which launched from jax/scripts/supervise_convnext_t_300ep_3060.sh with
# no job conf, so nothing asserted its trainer. It trained pre-C6, TF's crop sampler, the tanh GELU
# and the batch-256 scaling of the recipe (planning/gelu_erf_and_torchvision_crop.md §3.9;
# imagenet_parity.md D15). A new CKPT_BASE, in a lineage of its own: the 2026-10-06 lineage
# (`/home/skoonce/cnx_t_default_300ep/`) was the global-256 recipe and would be resumed by
# jax_job.sh (newest .state.npz) if shared.
#
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo.
RECIPE=default
DEVS="0,1,2,3"
EPOCHS=300
CKPT_BASE=/home/skoonce/cnx_t_jax_2611/convnext_tiny_imagenet_full   # the 2026-10-12 official recipe (4096 as 256 x 16, no clip, lr 4e-3)
PY_REL=.lake/build/generated_convnext_tiny_imagenet_full.py    # relative to jax/
# From the 2026-10-12 smoke (ETA below); the chunk planner replaces EPOCH_SECS with the longest epoch it
# times itself.
EPOCH_SECS=910
ETA="~76 h for 300 ep on 4x 4060 Ti (2026-10-12 smoke, runs/2026-10-12-cnx-jax-smoke/: 2.83 s a 4096-row optimizer step = 177 ms a 256-row micro-batch, 312 steps + ~28 s the f32 validation an epoch; the one-shot global-256 trainer ran 76.5 h on 4x 3060 at 179 ms/step)"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_cnx_default_jax
precheck_cnx_default_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  pc_crop "jax/$PY_REL" torchvision || ok=1   # train crop + resize kernel
  pc_gelu "jax/$PY_REL" exact || ok=1   # nn.GELU's x·Φ(x), not the tanh approximation
  pc_jax_trainer || ok=1
  pc_aug_call "jax/$PY_REL" '_randaugment(img, 2, 9.000000, 0.500000)' "ConvNeXt RandAugment m9 mstd0.5" || ok=1
  pc_aug_no_call "jax/$PY_REL" '_autoaugment(' "ConvNeXt's recipe is RandAugment only" || ok=1
  grep -q 'ConvNeXt paper init' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no ConvNeXt init (cnxInit) — re-emit"; ok=1; }
  grep -q '^"""ConvNeXt-T (ImageNet' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not the ConvNeXt-T trainer"; ok=1; }
  grep -q '^    EPOCHS = 300$' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL does not anneal over 300 epochs — the 80-epoch trainer is generated_convnext_tiny_imagenet.py"; ok=1; }
  # ⭐ 2026-10-12, the official recipe (planning/recipe_prep.md §4). Each line below is the emitted text
  # of one recipe item; a trainer missing any of them is the global-256 recipe of 2026-10-06.
  # The accumulation geometry: 16 micro-batches of 256 = the verified render's 16 x (4 x 64).
  grep -q '^GRAD_ACCUM = 16$' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not the 256 x 16 accumulation trainer (GRAD_ACCUM 16)"; ok=1; }
  grep -q 'MICRO_BATCH = (256 // n_devices)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's micro-batch is not 256 (4 x 64) — re-emit"; ok=1; }
  grep -q 'BATCH_SIZE = MICRO_BATCH \* GRAD_ACCUM' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL does not accumulate to the effective batch — re-emit"; ok=1; }
  grep -q '^LR = 0.004000' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not at the official lr 4e-3 for batch 4096 — re-emit"; ok=1; }
  grep -q 'warmup_steps = steps_per_epoch \* 20' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL does not warm up per step over 20 epochs — re-emit"; ok=1; }
  grep -q 'lr = jnp.float32(0.000001 + (LR - 0.000001) \* 0.5 \* (1 + np.cos(np.pi \* min(prog, 1.0))))   # timm lr_min floor' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's per-step cosine is not floored at min_lr 1e-6 (minLR) — re-emit"; ok=1; }
  if grep -q 'lr = jnp.float32(0.000001 + 0.5 \* (LR - 0.000001) \* (1 + np.cos(np.pi \* epoch / EPOCHS)))' "jax/$PY_REL"; then
    echo "⛔ jax/$PY_REL steps its schedule once per EPOCH (schedPerEpoch) — ConvNeXt's is per iteration"; ok=1; fi
  grep -q 'random() < 0.500000' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL alternates Mixup/CutMix by step — the official trainer draws one per batch at p 0.5 (mixSwitchProb)"; ok=1; }
  grep -q '^_RA_FILL = tf.constant(\[124.0, 116.0, 104.0\])' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL fills RandAugment's geometric ops with 128, not timm's img_mean (randAugmentFillMean)"; ok=1; }
  grep -q 'DT = jnp.float32; CONV_DT = jnp.float32   # evalF32' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL scores through its bf16 training forward, not f32 (evalF32)"; ok=1; }
  grep -q 'd = EMA_DECAY   # emaWarmup off' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL ramps the EMA decay in — timm's ModelEma holds it from step 0 (emaWarmup)"; ok=1; }
  grep -q '^EMA_DECAY = 0.999900' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's EMA decay is not the official 0.9999"; ok=1; }
  if grep -q 'gn = jnp.sqrt(sum(jnp.sum(g \* g)' "jax/$PY_REL"; then
    echo "⛔ jax/$PY_REL clips gradients — the official recipe does not (--clip_grad None)"; ok=1; fi
  pc_gpu_idle || ok=1
  return $ok
}
