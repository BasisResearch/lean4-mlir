# mnv4-full-e100-4gpu.conf — MobileNetV4-Conv-M / ImageNet-1k, VERIFIED path, the paper tier cut to 100 epochs.
#
#     RUNDIR=runs/<date>-mnv4-full-e100 scripts/supervise.sh mnv4-full-e100-4gpu
#
# ⭐ `mnv4-full-4gpu` with ONLY the length cut: `LEAN_MLIR_EPOCHS=100` sets the loop bound AND the
# cosine (`totalSteps := cfg.epochs * nb / accK`), on the same render, spec and shim. The verified
# peer of `mnv4-full100-jax-4gpu` (whose JAX recipe is `full100`; here the recipe field stays `full`
# because the driver's `LEAN_MLIR_RECIPE` takes `default` / `full` and supervise.sh pins the two
# equal). Checkpoint tag `e100`, so the 500-epoch lineage's checkpoint is never resumed into it.
# A one-day read on the recipe ahead of the 500-epoch pair — not the paper's 79.9 %. Below, the
# 500-epoch conf's text:
#
# The verified peer of `mnv4-full-jax-4gpu`: the paper's 500-epoch recipe AS THE PAPER'S OWN TRAINING
# CONFIG HAS IT (tensorflow/models `official/vision/configs/experiments/image_classification/
# imagenet_mobilenetv4_conv_medium_tpu.yaml`, "Top-1 Acc: 79.9% @ 500 epochs"; 2026-10-12,
# planning/recipe_prep.md §5): the paper's 256² on its own renders (slug `mnv4in256`,
# `mnv4Imagenet256FullVerified`, final side 8), AdamW 0.004 at effective 4096 (4 x 128 x k=8,
# sync-BN over 512) at Keras' ε 1e-7, wd 0.1 off norm/bias, label smoothing 0.1 (baked), dropout 0.2
# and drop-path 0.075 on the 18 skip UIB blocks at tf-models' ramp over its 26-entry block list
# (UIB i keeps 1 − 0.075·(i+3)/26; host-drawn masks), BatchNorm ε 1e-3 (baked) and decay 0.997 (the
# host's EMA), tf-models' schedule (the cosine over every step from step 0, the linear warmup on top),
# RandAugment N2 m15 at p 0.7 from the `full` shim under TF's mappings (extrapolated past 10, an
# identity branch in the draw, translate ±150 px, nearest resampling, fill 128), TF's crop sampler at
# min_object_covered 0.08 with tf-models' centre-crop fallback (0.875 of the shorter side where the sampler returned the whole image), bilinear resizes without antialias, the
# eval centre crop 0.875 of the short side then resize; no EMA (the live weights are scored), bf16,
# eval every 5 epochs. `LEAN_MLIR_RECIPE=full` selects the spec; the driver refuses a variant without
# `drop` on it. The 224 tier (`mnv4-default-4gpu`, the 100-epoch pair) is untouched.
# Score afterwards at the paper's own protocol (the run's 256 / 0.875) and at timm's test protocol
# for `mobilenetv4_conv_medium.e500_r256_in1k`, 320 / 1.0, through `mnv4in256_fwd_eval_s320`
# (`scripts/parity/score_timm.sh mnv4-in256`).
# Disclosed, not reproduced: the init (timm's, D4), the decay reaching the classifier bias (the yaml
# excludes BN only), the head order (timm pools before its 1280 conv; tf-models' list runs it at 8×8).

# ▶ §2c N1: this must equal the second dash-field of the filename.
RECIPE=full
DEVS="0,1,2,3"
EPOCHS=100
# 2026-10-12 smoke at 256² (runs/2026-10-12-mnv4-full-4gpu/): see ETA; the chunk planner replaces
# EPOCH_SECS with the longest epoch it times itself.
EPOCH_SECS=540
ETA="~15 h for 100 ep on 4x 4060 Ti at 256² (the 500-epoch conf's 2026-10-12 smoke ÷ 5: med 214 ms per 512-row micro-step, 2,496 micro-steps + the streamed f32 eval every 5th epoch; compute-bound)"

CMD=(.lake/build/bin/mobilenetv4-imagenet-verified data)

. "$(dirname "${BASH_SOURCE[0]}")/_box.sh"   # BOX, BOX_PLUG, BOX_PY, BOX_SHIMPY
VARIANT=accdp8x128wxdropdowd01bf16
SLUG=mnv4in256
CKPT_TAG=e100   # the 100-epoch cut's own checkpoint (`LEAN_MLIR_CKPT_TAG`); untagged = the 500-epoch lineage
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  LEAN_MLIR_RECIPE=full              # the 256² spec: the m15 shim, dropout 0.2, the drop-path keeps, BN 0.997, the tf-models cosine
  LEAN_MLIR_VARIANT=$VARIANT
  LEAN_MLIR_CKPT_TAG=$CKPT_TAG
  LEAN_MLIR_BATCH=128                # PER REPLICA, baked into the render
  LEAN_MLIR_EPOCHS=100               # = EPOCHS; sets the cosine length as well as the loop bound
  LEAN_MLIR_BASE_LR_U=4000           # 0.004, the reference's peak at effective 4096
  LEAN_MLIR_G2_STEPS=2496            # 312 × k: whole accumulation cycles, the reference's 312 steps
  LEAN_MLIR_VAL_EVERY=5              # the reference's cadence; the last epoch is always scored
  SHIM_WORKERS=4                     # the MNv4 shim peaks at 4 producers (side_quest_runs.md §4.2)
  LEAN_MLIR_SHIM_RESPAWN_EPOCHS=10
)
# The 256 render at 4 x 128 peaks at 4.02 GiB of the 11.68 GiB default arena (34 %;
# runs/2026-10-12-mnv4-full-4gpu/peak_memory_256.log) — no LEAN_MLIR_MEM_FRACTION.

TEMP_MAX=78
TEMP_RESUME=62

CKPT_EPOCH_FILE=".lake/build/${SLUG}_${VARIANT}_ckpt_xla_${CKPT_TAG}.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_mnv4_full_e100
precheck_mnv4_full_e100() {
  . scripts/lib/precheck.sh
  local ok=0
  local shim=jax/.lake/build/generated_mobilenet_v4_imagenet_full_shim.py
  # TF's sampler with tf-models' centre-crop fallback (classification_input.py; 0.875 of the shorter side, int((shape - size)/2) offsets), resized bilinear
  . scripts/lib/precheck.sh; pc_crop "$shim" tf-centre bilinear || ok=1   # train crop + resize kernel
  local mlir="verified_mlir/${SLUG}_${VARIANT}_train_step.mlir"
  pc_box || ok=1
  pc_render "$SLUG" "$VARIANT" 4 464 || ok=1
  pc_ckpt "$SLUG" "$VARIANT" "$CKPT_TAG" || ok=1
  pc_exe mobilenetv4-imagenet-verified LeanMlir/Verified/Train.lean LeanMlir/Verified/NetsCore.lean \
    LeanMlir/Verified/Spec.lean apps/imagenette/MainMobilenetV4Imagenet.lean || ok=1
  pc_pjrt_so || ok=1
  if [ -f "$mlir" ]; then
    # 4 regions [θ|m|v|G] x 233 + 154 BN stats + 18 drop masks + the dropout mask + 2 data + 5 scalars.
    # the driver copies the output blob back, so #out = #in − 2 with every mask passed through
    python3 scripts/gates/train_step_arity.py "$mlir" | grep -v '^✓'; [ "${PIPESTATUS[0]}" = 0 ] || ok=1
    local nargs; nargs="$(sed -n '2p' "$mlir" | grep -o '%[a-zA-Z0-9_]*: tensor<' | wc -l)"
    [ "$nargs" = "1112" ] || {
      echo "⛔ $mlir has $nargs operands, not 1112 — not the no-EMA drop-path layout."; ok=1; }
    # THE RESOLUTION: 3 · 256 · 256 = 196,608 per image, the render's own input width.
    sed -n '2p' "$mlir" | grep -q '%x: tensor<128x196608xf32>' || {
      echo "⛔ $mlir does not take a 256² input — that is the 224 render."; ok=1; }
    grep -q 'EMA WEIGHT SHADOW' "$mlir" && {
      echo "⛔ $mlir carries an EMA shadow; the paper tier has none."; ok=1; }
    grep -q 'stablehlo.constant dense<0.1> : tensor<f32>' "$mlir" || {
      echo "⛔ $mlir does not bake the paper's wd 0.1."; ok=1; }
    # the two ε's the paper's config names: BatchNorm 1e-3 at every BN site, AdamW 1e-7 (not 1e-8)
    grep -q '%eps = stablehlo.constant dense<1.0e-7> : tensor<f32>' "$mlir" || {
      echo "⛔ $mlir does not bake AdamW's ε 1e-7 (Keras' default, Table 10)."; ok=1; }
    grep -q 'dense<1.0e-8>' "$mlir" && {
      echo "⛔ $mlir still carries a 1e-8 constant."; ok=1; }
    grep -q 'dense<1.0e-5>' "$mlir" && {
      echo "⛔ $mlir carries BatchNorm ε 1e-5 — timm's, not the yaml's 1e-3."; ok=1; }
    # its own evals: the recipe's at 256 and timm's test protocol at 320
    [ -f "verified_mlir/${SLUG}_fwd_eval.mlir" ] || { echo "⛔ missing verified_mlir/${SLUG}_fwd_eval.mlir"; ok=1; }
    [ -f "verified_mlir/${SLUG}_fwd_eval_s320.mlir" ] || { echo "⛔ missing verified_mlir/${SLUG}_fwd_eval_s320.mlir (timm's 320 / 1.0)"; ok=1; }
  fi
  pc_jax_box || ok=1
  pc_shim mobilenet_v4_imagenet_full || ok=1
  pc_aug_call "$shim" '_randaugment(img, 2, 15.0' "RandAugment N2 m15, the paper tier" || ok=1
  pc_aug_call "$shim" 'tf.random.uniform([]) < 0.700000,' "RandAugment layers at p 0.7, the paper tier" || ok=1
  pc_aug_no_call "$shim" '_autoaugment(' "the paper tier is RandAugment only" || ok=1
  # ⭐ 2026-10-12, the yaml's small print (planning/recipe_prep.md §5): each line is the emitted text of
  # one recipe item; a shim missing any of them is the 10-07 recipe.
  grep -q '^_IMG_SIZE = 256$' "$shim" || { echo "⛔ $shim is not at the paper's 256 (imgSize) — re-emit"; ok=1; }
  grep -q '^_CROP_PCT = 0.875' "$shim" || { echo "⛔ $shim's eval crop is not 0.875 of the short side (testCropRatio) — re-emit"; ok=1; }
  grep -q 'len(_RA_OPS) + 1, dtype=tf.int32)' "$shim" || { echo "⛔ $shim draws RandAugment ops without tf-models' identity branch (randAugmentIdentityOp) — re-emit"; ok=1; }
  grep -q "^def _aa_trn(m): return (m/_AA_MAX)\*100" "$shim" || { echo "⛔ $shim translates by timm's fraction of the side, not tf-models' 100 px per 10 (randAugmentTranslateConst) — re-emit"; ok=1; }
  grep -q "interpolation='NEAREST'" "$shim" || { echo "⛔ $shim resamples its geometric ops bilinear, not nearest (augNearest) — re-emit"; ok=1; }
  grep -q '^_RA_FILL' "$shim" && { echo "⛔ $shim fills with timm's img_mean; tf-models fills 128"; ok=1; }
  grep -q 'min_object_covered=0.08,' "$shim" || { echo "⛔ $shim's sampler is not at tf-models' min_object_covered 0.08 (cropMinCovered) — re-emit"; ok=1; }
  grep -q '^def _imagenet_decode_center_crop_timm' "$shim" || { echo "⛔ $shim has no timm eval form beside tf-models' (evalCropTf) — re-emit"; ok=1; }
  # tf-models' resizes do not antialias (resizeAntialias); the ONE antialias=True left is timm's eval
  # form, which keeps PIL's behaviour for timm's protocol.
  [ "$(grep -c 'antialias=True' "$shim")" = "1" ] || { echo "⛔ $shim antialiases a train or tf-models eval resize; tf-models' pipeline does not (resizeAntialias)"; ok=1; }
  grep -q 'method=tf.image.ResizeMethod.BILINEAR, antialias=False)\[0\]' "$shim" || { echo "⛔ $shim's train resize is not bilinear without antialias — re-emit"; ok=1; }
  pc_env LEAN_MLIR_RECIPE=full "selects the 256² spec, the m15 shim and the dropout/drop-path keeps" || ok=1
  pc_env LEAN_MLIR_CKPT_TAG=$CKPT_TAG "the 100-epoch lineage, not the 500-epoch checkpoint" || ok=1
  pc_env SHIM_WORKERS=4 "the MNv4 shim's measured peak" || ok=1
  pc_env LEAN_MLIR_EPOCHS=100 "sets the cosine; must equal EPOCHS" || ok=1
  pc_env LEAN_MLIR_BASE_LR_U=4000 "0.004, the reference's peak at 4096" || ok=1
  pc_env LEAN_MLIR_G2_STEPS=2496 "312 whole accumulation cycles of 8" || ok=1
  pc_env LEAN_MLIR_BATCH=128 "the render's per-replica batch" || ok=1
  # The per-epoch top-1 bitmaps, for the McNemar pairing with the JAX half (scripts/demos/mcnemar.py).
  # PRECHECK runs in the supervisor's shell after RUNDIR is fixed, so the path is the run's own.
  mkdir -p "$RUNDIR/bitmaps"
  ENV_EXTRA+=("LEAN_MLIR_DUMP_CORRECT=$RUNDIR/bitmaps/${SLUG}_${VARIANT}")
  echo "  per-image bitmaps -> $RUNDIR/bitmaps/${SLUG}_${VARIANT}_e{N}.bin (LEAN_MLIR_DUMP_CORRECT)"
  pc_gpu_idle || ok=1
  return $ok
}
