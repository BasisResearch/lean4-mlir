# ViT-Tiny (DeiT-Ti) / ImageNet-1k, JAX REFERENCE path, the `default` recipe (300 epochs), 4 GPUs.
#
#     START_AT=00:00 STOP_AT=08:00 setsid nohup scripts/supervise.sh vit-default-jax-4gpu >/dev/null 2>&1 &
#
# The JAX side of the ViT-Ti pair; the verified side is `vit-default-emabf16-4gpu`
# (`emadp128x4wxclipdropeps0000001erfbf16`). Recipe = `vitTinyImagenetConfig`: DeiT-Ti at batch 512, AdamW 5e-4,
# wd 0.05 off norm/bias/pos/CLS, 5 warmup epochs + cosine, clip 1.0, mixup 0.8 / cutmix 1.0,
# RandAugment m9 mstd0.5 inc1, random erasing 0.25, repeated augmentation ×3, drop-path 0.1,
# label smoothing 0.1, EMA 0.99996, bf16, timm/DeiT trunc_normal(0.02) init; since 2026-10-01 also
# DeiT's LN ε 1e-6 and min_lr 1e-5, with the patch embed and head in fp32 (the verified render's
# carve-out). The verified peer is `emadp128x4wxclipdropeps0000001erfbf16` (planning/vit_parity_todo.md).
#
# Third reference run. The 72.31 (`deit-init`, 2026-08-29) trained the day before 4b765be7 at an
# effective label smoothing of 0; the 72.07 (runs/2026-10-01-vit-jax-bf16-300ep/, the post-C6 pair
# with the verified 72.42) trained the tanh GELU under TF's crop sampler. This one computes the
# exact GELU x·Φ(x) (`geluExact`, a7a9320c) and crops with torchvision's RandomResizedCrop + bicubic
# (`cropTorchvision`, aa974a95) — planning/gelu_erf_and_torchvision_crop.md §3.9, the two items
# the verified `…erf…` render carries too. Everything else is the 10-01 recipe.
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo, in a directory of their own: the 10-01 run's
# /home/skoonce/vit_tiny_default_300ep/ holds its epoch-300 state, and a CKPT_BASE pointed there
# would resume it and finish at once (jax_job.sh resumes from the newest .state.npz).
RECIPE=default
DEVS="0,1,2,3"
EPOCHS=300
CKPT_BASE=/home/skoonce/vit_tiny_jax_2611/vit_tiny_imagenet   # the 2026-10-11 recipe (batch 1024, no clip, timm's schedule); the 10-01 run's ckpts stay in …_2610/
PY_REL=.lake/build/generated_vit_tiny_imagenet.py    # relative to jax/
# The 72.31 run took 34.2 h on the 4× 3060 box (~164 ms/step). ⚠ On 4× 4060 Ti the tf.data
# augmentation is the bottleneck: MEASURED 2026-09-25 at ~380 ms/step steady (a 15-min smoke of
# this trainer), ~79 h for 300 ep. Run it on the 3060 box. The chunk planner replaces EPOCH_SECS
# with the longest epoch it times itself.
EPOCH_SECS=580   # 2026-10-11 smoke on ares at 1024: 560 s train + 18 s val
ETA="~48 h on ares at 1024 (2026-10-11 smoke, runs/2026-10-11-vit-jax-smoke/: 448 ms a 1024-row step, 560 s train + 18 s val an epoch, 300 ep); the 3060 box is unmeasured at 1024 — its 10-01 run at 512 took 45.91 h (220 ms/step, 545 s/epoch)"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_vit_default_jax
precheck_vit_default_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  . scripts/lib/precheck.sh; pc_crop "jax/$PY_REL" torchvision || ok=1   # train crop + resize kernel
  pc_gelu "jax/$PY_REL" exact || ok=1   # nn.GELU's x·Φ(x), not the tanh approximation
  pc_jax_trainer || ok=1
  pc_aug_call "jax/$PY_REL" '_randaugment(img, 2, 9.000000, 0.500000)' "DeiT RandAugment m9 mstd0.5" || ok=1
  pc_aug_no_call "jax/$PY_REL" '_autoaugment(' "DeiT's recipe is RandAugment only" || ok=1
  # the reason for this run: smoothing folded INTO the mixed target (4b765be7)
  grep -q 'one_hot(y, 1000) \* (1.0 - 0.100000) + 0.100000 / 1000' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL mixes raw one-hots — it predates 4b765be7 and trains at label smoothing 0"; ok=1; }
  grep -q '(timm trunc_normal std=0.02)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL has no DeiT init — re-emit (the default recipe carries vitInit since 2026-09-25)"; ok=1; }
  # 2026-10-01 parity with the verified eps0000001 render: DeiT's LN ε and min_lr, fp32 stem/head
  grep -q 'jnp.sqrt(var + 0.000001)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's layer_norm is not at ε 1e-6 — re-emit (lnEps)"; ok=1; }
  # ⭐ 2026-10-11, DeiT as timm runs it (planning/imagenet_parity.md §10.4; ch 9's marker). Each line
  # below is the emitted text of one recipe item; a trainer missing any of them is the 10-01 recipe.
  grep -q '^LR = 0.001000' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not at DeiT's lr 1e-3 for batch 1024 (5e-4 · 1024/512) — re-emit"; ok=1; }
  grep -q 'BATCH_SIZE = (1024 // n_devices)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not at DeiT's global batch 1024 — re-emit"; ok=1; }
  grep -q 'lr = jnp.float32(0.000010 + 0.5 \* (LR - 0.000010) \* (1 + np.cos(np.pi \* epoch / EPOCHS)))' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's schedule is not timm's per-epoch cosine over all 300 epochs (schedPerEpoch) — re-emit"; ok=1; }
  grep -q 'lr = jnp.float32(0.000001 + epoch \* (LR - 0.000001) / 5)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL does not warm up from timm's 1e-6 once per epoch (warmupLRInit) — re-emit"; ok=1; }
  grep -q 'random() < 0.500000' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL alternates Mixup/CutMix by step — timm draws one per batch at p 0.5 (mixSwitchProb)"; ok=1; }
  grep -q '^_RA_FILL = tf.constant(\[124.0, 116.0, 104.0\])' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL fills RandAugment's geometric ops with 128, not timm's img_mean (randAugmentFillMean)"; ok=1; }
  grep -q '# repeatedAugAdjacent' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL re-shuffles the 3 repeated-augmentation copies apart (repeatedAugAdjacent)"; ok=1; }
  grep -q 'DT = jnp.float32; CONV_DT = jnp.float32   # evalF32' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL scores through its bf16 training forward, not f32 (evalF32)"; ok=1; }
  grep -q 'd = EMA_DECAY   # emaWarmup off' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL ramps the EMA decay in — DeiT's ModelEma holds it from step 0 (emaWarmup)"; ok=1; }
  if grep -q 'gn = jnp.sqrt(sum(jnp.sum(g \* g)' "jax/$PY_REL"; then
    echo "⛔ jax/$PY_REL clips gradients — DeiT does not (--clip-grad None; runs/2026-10-11-vit-clipoff-probe/)"; ok=1; fi
  [ "$(grep -c 'x = jnp.matmul(x, params\[' "jax/$PY_REL")" = "2" ] || {
    echo "⛔ jax/$PY_REL does not keep the patch embed AND the head in fp32 — re-emit (f32StemHead)"; ok=1; }
  pc_gpu_idle || ok=1
  return $ok
}
