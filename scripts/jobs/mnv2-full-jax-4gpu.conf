# MobileNetV2 / ImageNet-1k, JAX REFERENCE path, the `full` recipe (420 epochs), 4 GPUs.
#
#     setsid nohup scripts/supervise.sh mnv2-full-jax-4gpu >/dev/null 2>&1 &
#
# MobileNetV2 AS TF-SLIM TRAINED IT — `research/slim/nets/mobilenet/README.md`'s own reproduction
# command, read with the sources it runs (2026-10-12, planning/recipe_prep.md §6;
# `mobilenetV2ImagenetConfigFull` names the README's line beside each value): TF1's RMSProp (ρ 0.9,
# μ 0.9, ε 1.0 inside the root, the mean-square from 1, the rate INSIDE the momentum term —
# `ApplyRMSProp`, D13) at 0.12 on the global 256 (the README's 0.045 per 96 images), ×0.98 every 2.5
# epochs as a staircase from step 0 with no warmup, coupled L2 4e-5 off BN γ/β, biases and the
# depthwise kernels (D11), truncated-normal σ 0.09 on every kernel and the logits, dropout 0.2, label
# smoothing 0.1, the model-EMA shadow at 0.9999 in TF's warmup-corrected form (scored), BN 0.997 /
# ε 1e-3; slim's inception crop (area ≥ 0.05, aspect 0.75–1.33, 100 attempts, the whole image on
# exhaustion), bilinear resize without antialias, flip, `distort_color` in fast mode (brightness
# ±32/255 then saturation ×0.5–1.5, clipped; D12), the input scaled (x − 0.5) × 2; 420 epochs (the
# README's "about 700K steps" on 8 clones of 96); eval every epoch on running BN in f32 (F8); bf16.
# The verified peer is `mnv2-default-4gpu` (`emarmstfdp64wxdwdoeps0001bf16`).
# Disclosed, not reproduced: slim's eval (central_crop 0.875 on both sides, then a bilinear resize to
# 224) — scored at timm's 224 / 0.875 like every pair; the sixteen asynchronous workers of 96.
#
# The reference run of runs/2026-09-27-mnv2-jax-bf16-350ep/ (§6.5, 71.63 against the verified 71.12)
# trained the paper's sentence instead (0.045 unscaled, ×0.98 per epoch, 350 epochs, no smoothing,
# no EMA, timm's crop, mean/std, the fan-rule init) from `/home/skoonce/mnv2_full350_relu6/`; this
# conf's lineage is its own. Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo, in a directory of their own: a CKPT_BASE pointed at
# ~/mnv2_350ep or ~/mnv2_full350_relu6 would resume a finished run and finish at once.
RECIPE=full
DEVS="0,1,2,3"
EPOCHS=420
CKPT_BASE=/home/skoonce/mnv2_full_jax_2612/mobilenet_v2_imagenet_full   # the 2026-10-12 recipe (the README's)
PY_REL=.lake/build/generated_mobilenet_v2_imagenet_full.py    # relative to jax/
# 2026-10-12 smoke (runs/2026-10-12-mnv2-jax-smoke/): see ETA; the chunk planner replaces EPOCH_SECS
# with the longest epoch it times itself.
EPOCH_SECS=420
ETA="~49 h for 420 ep on 4x 4060 Ti (2026-10-12 smoke, runs/2026-10-12-mnv2-jax-smoke/: 81 ms a 256-row step at the default arena, compile excluded — feed-bound, the retired run's pace; 5,004 steps + ~15 s the f32 validation every epoch)"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_mnv2_full_jax
precheck_mnv2_full_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  # TF's sampler (slim's inception crop) without EfficientNet's centre-crop fallback, resized bilinear
  . scripts/lib/precheck.sh; pc_crop "jax/$PY_REL" tf bilinear || ok=1   # train crop + resize kernel
  pc_jax_trainer || ok=1
  pc_aug_no_call "jax/$PY_REL" '_autoaugment(' "slim's pipeline has no AutoAugment" || ok=1
  pc_aug_no_call "jax/$PY_REL" '_randaugment(' "slim's pipeline has no RandAugment" || ok=1
  # ⭐ 2026-10-12, the README's lines (planning/recipe_prep.md §6): each grep is the emitted text of one
  # recipe item; a trainer missing any of them is the retired recipe.
  grep -q 'WD_MASK = _wd_mask(params)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL decays BN γ/β and biases — it predates wdExcludeNormBias; re-emit"; ok=1; }
  grep -q 'p.ndim == 4 and p.shape\[1\] == 1 and p.shape\[0\] > 1: return jnp.zeros_like(p)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL decays the depthwise kernels — slim regularises conv2d only (wdExcludeDepthwise, D11); re-emit"; ok=1; }
  grep -q 'MOMENTUM \* b + lr \* g / jnp.sqrt(s + EPS)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL applies the rate outside the momentum term — not TF1's ApplyRMSProp (rmspropTf, D13); re-emit"; ok=1; }
  grep -q 'lambda p, b: p - b, params, buf)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL steps p - lr*b — not TF1's p - mom (rmspropTf); re-emit"; ok=1; }
  grep -q '^EPS = 1.000000' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL is not at RMSProp ε 1.0"; ok=1; }
  grep -q '^WD = 0.000040' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL is not at wd 4e-5"; ok=1; }
  grep -q '^    LR = 0.120000' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL is not at the README's 0.12 for 256 (0.045 per 96)"; ok=1; }
  grep -q '^    EPOCHS = 420$' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL is not the README's 420 epochs"; ok=1; }
  grep -q 'np.floor(_ep / 2.5' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL does not step ×0.98 every 2.5 epochs as a staircase (expLRDecayEpochs 2.5, expLRStaircase); re-emit"; ok=1; }
  grep -q 'eps=0.001, momentum=0.997' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL is not at TF-slim BN (ε 1e-3, decay 0.997); re-emit"; ok=1; }
  [ "$(grep -c 'random.truncated_normal(k_, -2., 2.,' "jax/$PY_REL")" = "53" ] || {
    echo "⛔ jax/$PY_REL does not init its 53 kernels (35 conv-BN + 17 depthwise + the logits) truncated-normal (initTruncNormal 0.09); re-emit"; ok=1; }
  grep -q 'random.uniform(k_, (' "jax/$PY_REL" && { echo "⛔ jax/$PY_REL still fan-inits a kernel"; ok=1; }
  grep -q '^EMA_DECAY = 0.9999' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL trains no EMA shadow (useEMA 0.9999, the README's moving_average_decay); re-emit"; ok=1; }
  grep -q 'jnp.minimum(EMA_DECAY, (1.0 + step) / (10.0 + step))' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's EMA is not TF's warmup-corrected form (emaWarmup); re-emit"; ok=1; }
  grep -q 'random_brightness(img, 32. / 255.)' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL has no slim brightness ±32/255 (colorDistortSlim, D12); re-emit"; ok=1; }
  grep -q 'random_saturation(img, 0.5, 1.5)' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL has no slim saturation 0.5–1.5 (colorDistortSlim, D12); re-emit"; ok=1; }
  grep -q 'random_hue\|random_contrast' "jax/$PY_REL" && { echo "⛔ jax/$PY_REL distorts hue or contrast — the non-fast mode, which slim did not run"; ok=1; }
  grep -q '_MEAN_RGB = tf.constant(\[127.5' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL normalises by the ImageNet mean/std, not slim's (x − 0.5) × 2 (inputScalePm1); re-emit"; ok=1; }
  grep -q 'area_range=(0.05, 1.0), max_attempts=100' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL's sampler is not slim's (area ≥ 0.05, 100 attempts); re-emit"; ok=1; }
  grep -q 'aspect_ratio_range=(0.75, 1.33)' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL's sampler is not at slim's aspect (0.75, 1.33); re-emit"; ok=1; }
  grep -q 'method=tf.image.ResizeMethod.BILINEAR, antialias=False)\[0\]' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL's train resize is not bilinear without antialias (slim's resize_images); re-emit"; ok=1; }
  # the ONE antialias=True left is timm's eval form, the protocol this pair is scored at
  [ "$(grep -c 'antialias=True' "jax/$PY_REL")" = "1" ] || { echo "⛔ jax/$PY_REL antialiases a train resize; slim's pipeline does not (resizeAntialias)"; ok=1; }
  grep -q 'DT = jnp.float32; CONV_DT = jnp.float32   # evalF32' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL scores through its bf16 training forward, not f32 (evalF32)"; ok=1; }
  pc_gpu_idle || ok=1
  return $ok
}
