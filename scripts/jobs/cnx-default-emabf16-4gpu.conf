# cnx-default-emabf16-4gpu.conf — ConvNeXt-T / ImageNet-1k, VERIFIED path, the OFFICIAL recipe: EMA + bf16,
# batch 4096 as 16 accumulated micro-batches of 4 x 64, 300 epochs.
#
#     scripts/supervise.sh cnx-default-emabf16-4gpu
#
# The verified peer of `cnx-default-jax-4gpu`. ⭐ THE OFFICIAL ConvNeXt RECIPE, 2026-10-12
# (planning/recipe_prep.md §4; ch 8's `[TODO: …]` marker is this job's contract with its JAX peer).
# The values are facebookresearch/ConvNeXt `main.py`'s defaults and its README command: batch 4096
# (`--batch_size 128 --update_freq 4` on 8 cards; here 4 x 64 x 16, exact — ConvNeXt has no
# BatchNorm, so sixteen micro-batches of 256 ARE one batch of 4096), AdamW `--lr 4e-3` AT that
# batch, wd 0.05 off norm/bias/LayerScale, the per-STEP warmup over 20 epochs from 0 and the cosine
# floored at `--min_lr 1e-6` (the official `utils.cosine_scheduler`; host-side here, `minLR`), NO
# gradient clip (`--clip_grad` None), drop-path 0.1 (ConvNeXt-T's paper rate, the spec's ramp),
# label smoothing 0.1 (baked into the render), timm's `ModelEma` at 0.9999 CONSTANT from step 0
# (`emaWarmup := false`, host-side) advanced once per OPTIMIZER step (the driver hands the graph the
# identity on accumulate micro-batches), bf16 with the head in fp32, ConvNeXt `_init_weights`
# (cnxInit), the exact GELU; in the shim, as the reference: RandAugment m9 mstd0.5 inc1 with the
# geometric fill at timm's img_mean, Mixup 0.8 or CutMix 1.0 drawn per batch at p 0.5, pixel random
# erasing 0.25, torchvision's RandomResizedCrop at bicubic. The reference also scores in f32.
#
# The variant is `emaaccdp16xwxdroperfbf16` — the first accumulating ConvNeXt render:
# `OptRecipe.adamwAccum 16` through `convNextAdamTrainStepText`'s `acc` (ViT-B's mechanism of
# 2026-10-11 on this renderer), a FIFTH blob region `G` and the `%aup` / `%akeep` scalars
# (937 operands = 2 data + 5 x 182 + 7 scalars + 18 masks); the driver reads the 16 off the name
# (`VerifiedVariant.accK`: the digits after `accdp` up to the FIRST `x` — `wx`'s is two markers on)
# and applies on every sixteenth micro-batch, printing `▸ GRADIENT ACCUMULATION: k = 16`.
#
# ⚠⚠ LEAN_MLIR_G2_STEPS=4992, REQUIRED. 1,281,167 / 256 = 5,004 micro-batches an epoch and 5,004
#   mod 16 = 12: the driver REFUSES an epoch whose micro-batch count is not a multiple of k (the last
#   cycle would apply 12 micro-batches' gradient still divided by 16). 4,992 = the reference's 312
#   optimizer steps x 16 — its `steps_per_epoch = train_examples // 4096` drops the same remainder,
#   so the two paths see the same 1,277,952 images an epoch. The precheck asserts the value AND
#   the divisibility.
# ⚠ A NEW variant is a NEW checkpoint name — and a new blob SHAPE (five regions against four): the
#   one-shot `convnextin_emadpwxclipdroperfbf16` checkpoint cannot be resumed into this one, and the
#   driver's size guard refuses if asked to. That variant stays committed (the 10-06 recipe at 256).
# ⚠ The two paths draw Mixup's λ at different granularities: the JAX trainer once per 4096-row
#   effective batch, this shim once per 256-row micro-batch, the official trainer once per 128-row
#   per-GPU DataLoader batch. The switch draw (p 0.5, CutMix or Mixup) is per batch on both. A
#   variance detail, not a recipe item; recorded so a small gap is not read as a lowering fact.
#
# Score at timm's test protocol afterwards: 288 / 1.0 through `convnextin_erf_fwd_s288` (D18).
# The eval forward the driver opens by name for this variant is `convnextin_erf_fwd` at 64 (drop-free
# f32; the variant has no `_fwd` of its own).

# ▶ §2c N1: this must equal the second dash-field of the filename.
RECIPE=default
DEVS="0,1,2,3"
EPOCHS="${EPOCHS:-300}"
ETA="bf16 ~109 h on 4x 4060 Ti at 16 x (4 x 64) (2026-10-12 smoke, runs/2026-10-12-cnx-default-emabf16-4gpu/: med 242 / min 222 / p90 254 ms per 256-row MICRO-step at w4, starvation 20 ms; 4,992 micro-steps + ~105 s eval/ckpt an epoch, 300 ep); bare device 194 ms; the one-shot clip render read 237 ms/step on 2026-09-25"

CMD=(.lake/build/bin/convnext-imagenet-verified data)

. "$(dirname "${BASH_SOURCE[0]}")/_box.sh"   # BOX, BOX_PLUG, BOX_PY, BOX_SHIMPY
VARIANT=emaaccdp16xwxdroperfbf16
ENV_EXTRA=(
  "${BOX_SHIMPY[@]}"
  PJRT_PLUGIN="$BOX_PLUG"
  PJRT_REPLICAS=4
  LEAN_MLIR_REPLICAS=4
  # ⛔ `emadpwxclipdroperfbf16` is the one-shot global-256 recipe one marker away (four regions, the
  # clip); `emaaccdp16xwxdropbf16` is the tanh-GELU twin. PRECHECK asserts the string AND the
  # artifact's shape (five regions, %aup/%akeep, no stablehlo.minimum).
  LEAN_MLIR_VARIANT=$VARIANT
  LEAN_MLIR_BATCH=64                 # PER REPLICA -> 256 a micro-batch, x 16 accumulated = 4096; the render bakes 64
  LEAN_MLIR_EPOCHS=300               # SETS the cosine; MAX_EPOCHS would only cap it
  LEAN_MLIR_BASE_LR_U=4000           # 4e-3, the official `--lr` AT ITS batch of 4096 (the driver also defaults to it for an `acc` variant)
  LEAN_MLIR_G2_STEPS=4992            # 312 x 16: whole accumulation cycles = the reference's 312 optimizer steps (header)
  SHIM_WORKERS=4                     # ConvNeXt-T's measured best (w8 145.5 vs w4 126 ms/step)
  LEAN_MLIR_SHIM_RESPAWN_EPOCHS=10
)

TEMP_MAX=78
TEMP_RESUME=62
REST_EPOCHS=""          # temperature governs

CKPT_EPOCH_FILE=".lake/build/convnextin_${VARIANT}_ckpt_xla.bin.epoch"
epoch_now() {
  [ -f "$CKPT_EPOCH_FILE" ] || { echo 0; return; }
  local n; n="$(tr -cd '0-9' < "$CKPT_EPOCH_FILE")"
  echo "${n:-0}"
}

PRECHECK=precheck_cnx_emabf16
precheck_cnx_emabf16() {
  . scripts/lib/precheck.sh
  local ok=0
  . scripts/lib/precheck.sh; pc_crop jax/.lake/build/generated_convnext_tiny_imagenet_shim.py torchvision || ok=1   # train crop + resize kernel
  local render="verified_mlir/convnextin_${VARIANT}_train_step.mlir"
  pc_box || ok=1
  # 182 all-reduces = one per parameter gradient (no BatchNorm, so no statistic collectives)
  pc_render convnextin "$VARIANT" 4 182 || ok=1
  pc_ckpt convnextin "$VARIANT" || ok=1
  # nn.GELU in the train step and in the forward it scores through (the JAX conf's pc_gelu).
  pc_gelu_render convnextin "$VARIANT" exact || ok=1
  if [ -f "$render" ]; then
    # ⛔ THE BATCH, READ OFF THE ARTIFACT: the render must BAKE 64 (a 32 render under a forgotten
    # LEAN_MLIR_BATCH trains at global 128 and pairs against nothing), and the loss divisor is a
    # separate spelling of it (a 32.0 divisor on 64 rows is a silent 2x learning rate).
    grep -q 'tensor<64x3x224x224' "$render" || {
      echo "⛔ $render does not bake a 64-wide input."; ok=1; }
    grep -q 'stablehlo.constant dense<64.0> : tensor<64x1000xf32>' "$render" || {
      echo "⛔ $render's loss divisor is not 64.0 on a 64-row tensor."; ok=1; }
    # the shadow's scalar pair; the non-EMA siblings have neither
    grep -q '%oemad: tensor<f32>' "$render" || {
      echo "⛔ $render carries no EMA shadow (no %oemad operand)."; ok=1; }
    # THE ACCUMULATION, structurally: the two scalars in the signature and the graph's own banner.
    # A 4-region render under this variant name would be refused by the driver's blob sizing, but
    # the name is what selects the file, so the file is checked too.
    sed -n '2p' "$render" | grep -q '%aup: tensor<f32>, %akeep: tensor<f32>' || {
      echo "⛔ $render has no %aup / %akeep operands — not an accumulating render."; ok=1; }
    grep -q 'GRADIENT ACCUMULATION over 16 micro-batches' "$render" || {
      echo "⛔ $render is not rendered as AdamW over 16 accumulated micro-batches."; ok=1; }
    # 5 regions [θ|m|v|G|ema] x 182 params + 2 data + 7 scalars + 18 masks = 937; the driver copies
    # the output blob back, so #out = #in − 2 with every mask passed through
    python3 scripts/gates/train_step_arity.py "$render" | grep -v '^✓'; [ "${PIPESTATUS[0]}" = 0 ] || ok=1
    local nargs; nargs="$(sed -n '2p' "$render" | grep -o '%[a-zA-Z0-9_]*: tensor<' | wc -l)"
    [ "$nargs" = "937" ] || {
      echo "⛔ $render has $nargs operands, not 937 — that is not the 5-region EMA + accumulation layout."; ok=1; }
    # the clip's structural signature: 182 stablehlo.minimum in every clip render, 0 otherwise. The
    # official recipe does not clip: assert 0.
    local nmin; nmin="$(grep -c 'stablehlo\.minimum' "$render" || true)"
    [ "$nmin" = "0" ] || {
      echo "⛔ $render has $nmin stablehlo.minimum ops, not 0 — this is a clip render, not the official recipe."; ok=1; }
    grep -q 'wdExcludeNormBias' "$render" || {
      echo "⛔ $render does not exclude norm/bias from weight decay."; ok=1; }
  fi
  # ⭐ The real layout gate: it parses the artifact's signature and reconciles it against what the
  # DRIVER packs from the variant string alone — five regions and seven scalars here.
  if [ -x .lake/build/bin/vit-ema-drop-render ]; then
    .lake/build/bin/vit-ema-drop-render convnextin "$VARIANT" >/dev/null 2>&1 || {
      echo "⛔ vit-ema-drop-render convnextin $VARIANT FAILED — run it directly for the diagnosis."; ok=1; }
  else
    echo "⚠ vit-ema-drop-render not built (lake build vit-ema-drop-render) — layout gate skipped."
  fi
  pc_exe convnext-imagenet-verified LeanMlir/Verified/Train.lean ffi/f32_helpers.c \
    apps/imagenette/MainConvNeXtImagenet.lean || ok=1
  pc_pjrt_so || ok=1
  # The official schedule's floor and the constant EMA decay are host-side arguments of the app.
  grep -q '(minLR := 0.000001) (emaWarmup := false)' apps/imagenette/MainConvNeXtImagenet.lean || {
    echo "⛔ MainConvNeXtImagenet.lean does not pass (minLR := 0.000001) (emaWarmup := false)"
    echo "   — the cosine would anneal to 0 and the EMA decay would ramp in; neither is the official recipe."; ok=1; }

  # The shim is ConvNeXt-T's (`convnextImagenetVerified.shimScript`): one recipe for T/S/B.
  pc_jax_box || ok=1
  pc_shim convnext_tiny_imagenet || ok=1
  local shim=jax/.lake/build/generated_convnext_tiny_imagenet_shim.py
  pc_aug_call "$shim" '_randaugment(img, 2, 9.0' "RandAugment N2 m9" || ok=1
  pc_aug_call "$shim" '_random_erase(img)' "random erasing" || ok=1
  pc_aug_no_call "$shim" '_autoaugment(' "not in ConvNeXt's recipe" || ok=1
  # 2026-10-12, the shim side of the official-recipe items (the JAX conf asserts the trainer's):
  grep -q "rng.random() < 0.500000" "$shim" || {
    echo "⛔ $shim alternates Mixup/CutMix by step — the official trainer draws one per batch at p 0.5 (mixSwitchProb)"; ok=1; }
  grep -q '^_RA_FILL = tf.constant(\[124.0, 116.0, 104.0\])' "$shim" || {
    echo "⛔ $shim fills RandAugment's geometric ops with 128, not timm's img_mean (randAugmentFillMean)"; ok=1; }

  pc_env LEAN_MLIR_BATCH=64 "the render bakes 64; x 4 x 16 accumulated = the official 4096" || ok=1
  pc_env LEAN_MLIR_EPOCHS=300 "MAX_EPOCHS only CAPS, it cannot SET the cosine" || ok=1
  pc_env LEAN_MLIR_BASE_LR_U=4000 "lr 4e-3, the official rate at batch 4096 (2.5e-4 was the one-shot global-256 scaling)" || ok=1
  pc_env SHIM_WORKERS=4 "ConvNeXt's measured best producer count" || ok=1
  # ⚠⚠ the accumulation cycle must divide the epoch (header): asserted here rather than found by
  # the driver's refusal after the compile.
  pc_env LEAN_MLIR_G2_STEPS=4992 "5,004 micro-batches an epoch is not divisible by k = 16; 4,992 = 312 x 16, the reference's own count" || ok=1
  local g2; g2="$(pc_env_get LEAN_MLIR_G2_STEPS)"
  [ -n "$g2" ] && [ $(( g2 % 16 )) = 0 ] || {
    echo "⛔ LEAN_MLIR_G2_STEPS=$g2 is not a multiple of k = 16: the last cycle of every epoch would apply"
    echo "   a short gradient still divided by 16, and the driver refuses it."; ok=1; }
  pc_env_absent LEAN_MLIR_MEM_FRACTION "T fits the default arena (the one-shot render peaked ~4.9 GiB; the G region adds 114 MB); 0.97 OOMs ConvNeXt's bf16 arms in d2h" || ok=1
  printf '%s\n' "${ENV_EXTRA[@]}" | grep -qx 'LEAN_MLIR_SHIM_RESPAWN_EPOCHS=10' || {
    echo "⚠ LEAN_MLIR_SHIM_RESPAWN_EPOCHS=10 is not set — bare loaders on the heaviest shim in the fleet"
    echo "  and the longest schedule in the book. Deliberate?"; }
  # Per-image top-1 bitmaps, one per epoch, into this run's dir: the input a McNemar pairing with the
  # reference needs (scripts/demos/mcnemar.py; the JAX side's twin is eval_full50k.py's DUMP_CORRECT).
  # Appended HERE because PRECHECK runs in the supervisor's shell after RUNDIR is fixed, and the
  # conf is sourced before it is. 50 KB an epoch; gitignored (runs/**/*.bin).
  mkdir -p "$RUNDIR/bitmaps"
  ENV_EXTRA+=("LEAN_MLIR_DUMP_CORRECT=$RUNDIR/bitmaps/cnx_${VARIANT}")
  echo "  per-image bitmaps -> $RUNDIR/bitmaps/cnx_${VARIANT}_e{N}.bin (LEAN_MLIR_DUMP_CORRECT)"
  pc_gpu_idle || ok=1
  return $ok
}
