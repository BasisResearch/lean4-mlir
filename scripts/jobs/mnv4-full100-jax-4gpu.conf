# MobileNetV4-Conv-M / ImageNet-1k, JAX REFERENCE path, the `full100` recipe (100 epochs), 4 GPUs.
#
#     RUNDIR=runs/<date>-mnv4-full100-jax scripts/supervise.sh mnv4-full100-jax-4gpu
#
# ⭐ `mnv4-full-jax-4gpu` with ONLY the length cut to 100 epochs: `mobilenetV4ConvMImagenetConfigFull100`
# is `{ …ConfigFull with epochs := 100 }`, and the generated trainer differs from the 500-epoch one in
# `EPOCHS` alone (the cosine then runs over 100 × 312 steps from step 0, the 5-epoch warmup on top). A
# one-day read on the recipe ahead of the 500-epoch run — not the paper's 79.9 %. Everything below the
# header is the 500-epoch conf's, so the recipe greps are the same lines.
#
# The paper tier AS THE PAPER'S OWN TRAINING CONFIG HAS IT (tensorflow/models `official/vision/configs/
# experiments/image_classification/imagenet_mobilenetv4_conv_medium_tpu.yaml`, "Top-1 Acc: 79.9% @ 500
# epochs"; read 2026-10-12, planning/recipe_prep.md §5) on timm's net: 256², AdamW 0.004 @ 4096 =
# 512 × accum 8 at Keras' ε 1e-7, wd 0.1 off norm/bias, LS 0.1, dropout 0.2, drop-path 0.075 over
# tf-models' 25-entry ramp, BN ε 1e-3 / decay 0.997, the cosine over every step from step 0 with the
# 5-epoch linear warmup on top, RandAugment N2 m15 at p 0.7 under TF's mappings (extrapolated past 10,
# an identity branch in the draw, translate ±150 px, nearest resampling, fill 128), TF's crop sampler at
# min_object_covered 0.08 with the whole image on exhaustion, bilinear resizes without antialias, the
# eval centre crop 0.875 of the short side then resize, no EMA (the live weights are scored), eval
# every 5 epochs on running BN in f32, bf16. The verified peer is `mnv4-full-4gpu` (`mnv4in256`).
# Disclosed, not reproduced: the init (timm's), the decay reaching the classifier bias, the head order.
# Score afterwards at the paper's protocol (PROTOCOL=train: 256 / 0.875) and timm's for
# `mobilenetv4_conv_medium.e500_r256_in1k` (PROTOCOL=timm: 320 / 1.0, jax/timm_eval_protocols.json).
#
# Launch, resume and the shared trainer checks are scripts/lib/jax_job.sh.
# ⚠ Checkpoints live OUTSIDE the repo, in a lineage of their own: the 10-07 `~/mnv4_full_500ep/` recipe
# (224, timm's crop, BN 0.99) would be resumed by jax_job.sh (newest .state.npz) and is not this run.
RECIPE=full100
DEVS="0,1,2,3"
EPOCHS=100
CKPT_BASE=/home/skoonce/mnv4_full100_r256_2614/mobilenet_v4_imagenet_full100   # its own lineage: the 500-epoch dir would be RESUMED (newest .state.npz)
PY_REL=.lake/build/generated_mobilenet_v4_imagenet_full100.py    # relative to jax/
# 2026-10-12 smoke at 256² (runs/2026-10-12-mnv4-jax-smoke/): see ETA; the chunk planner replaces
# EPOCH_SECS with the longest epoch it times itself.
EPOCH_SECS=800
ETA="~23 h for 100 ep on 4x 4060 Ti at 256² (the 500-epoch conf's 2026-10-12 smoke ÷ 5: 2.56 s a 4096-row step, 312 steps + ~12 s the f32 validation every 5th epoch; feed-bound)"

. "$(dirname "${BASH_SOURCE[0]}")/../lib/jax_job.sh"   # CMD, epoch_now, pc_jax_trainer

PRECHECK=precheck_mnv4_full100_jax
precheck_mnv4_full100_jax() {
  . scripts/lib/precheck.sh
  local ok=0
  # TF's sampler without EfficientNet's centre-crop fallback, resized bilinear (tf-models' pipeline)
  . scripts/lib/precheck.sh; pc_crop "jax/$PY_REL" tf bilinear || ok=1   # train crop + resize kernel
  pc_jax_trainer || ok=1
  pc_aug_call "jax/$PY_REL" '_randaugment(img, 2, 15.000000' "RandAugment N2 m15, the paper recipe" || ok=1
  pc_aug_call "jax/$PY_REL" 'tf.random.uniform([]) < 0.700000,' "RandAugment layers at p 0.7, the paper recipe" || ok=1
  pc_aug_no_call "jax/$PY_REL" '_autoaugment(' "the paper recipe is RandAugment only" || ok=1
  grep -q '^EMA_DECAY' "jax/$PY_REL" && {
    echo "⛔ jax/$PY_REL still trains an EMA shadow — the full recipe scores live weights; re-emit"; ok=1; }
  # ⭐ 2026-10-12, the yaml's lines (planning/recipe_prep.md §5): each grep is the emitted text of one
  # recipe item; a trainer missing any of them is the 10-07 recipe (224, timm's crop, BN 0.99).
  grep -q '^_IMG_SIZE = 256$' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL is not at the paper's 256 (imgSize) — re-emit"; ok=1; }
  grep -q '^_CROP_PCT = 0.875' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL's eval crop is not 0.875 (testCropRatio) — re-emit"; ok=1; }
  grep -q '^def _imagenet_decode_center_crop_timm' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL has no timm eval form beside tf-models' crop-then-resize (evalCropTf) — re-emit"; ok=1; }
  # tf-models' resizes do not antialias (resizeAntialias); the ONE antialias=True left is timm's eval
  # form (`_imagenet_decode_center_crop_timm`), PROTOCOL=timm's.
  [ "$(grep -c 'antialias=True' "jax/$PY_REL")" = "1" ] || { echo "⛔ jax/$PY_REL antialiases a train or tf-models eval resize; tf-models' pipeline does not (resizeAntialias)"; ok=1; }
  grep -q 'method=tf.image.ResizeMethod.BILINEAR, antialias=False)\[0\]' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL's train resize is not bilinear without antialias — re-emit"; ok=1; }
  grep -q 'min_object_covered=0.08,' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL's sampler is not at min_object_covered 0.08 (cropMinCovered) — re-emit"; ok=1; }
  grep -q 'len(_RA_OPS) + 1, dtype=tf.int32)' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL draws RandAugment ops without the identity branch (randAugmentIdentityOp) — re-emit"; ok=1; }
  grep -q "^def _aa_trn(m): return (m/_AA_MAX)\*100" "jax/$PY_REL" || { echo "⛔ jax/$PY_REL translates by timm's fraction of the side (randAugmentTranslateConst) — re-emit"; ok=1; }
  grep -q "interpolation='NEAREST'" "jax/$PY_REL" || { echo "⛔ jax/$PY_REL resamples its geometric ops bilinear, not nearest (augNearest) — re-emit"; ok=1; }
  grep -q '^_RA_FILL' "jax/$PY_REL" && { echo "⛔ jax/$PY_REL fills with timm's img_mean; tf-models fills 128"; ok=1; }
  grep -q '^_RA_INC = True' "jax/$PY_REL" && { echo "⛔ jax/$PY_REL uses timm's inc1 mappings; the paper's code uses TF's"; ok=1; }
  grep -q 'def _bn(x, gamma, beta, prev, training, eps=0.001, momentum=0.999625)' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL's BatchNorm is not at the yaml's ε 1e-3 / decay 0.997 (0.997^(1/8) per micro-batch) — re-emit"; ok=1; }
  grep -q 'jnp.sqrt(vi) + 1e-7)' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL's AdamW is not at Keras' ε 1e-7 (adamEps) — re-emit"; ok=1; }
  grep -q 'dpkeys\[1\], 0.988000)' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL's drop-path ramp is not tf-models' (i+3)/25 (dropPathAllBlocks: UIB 1 keeps 0.988) — re-emit"; ok=1; }
  grep -q 'dpkeys\[17\], 0.940000)' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL's last skip UIB does not keep 0.940 (tf-models' ramp) — re-emit"; ok=1; }
  grep -q '_cos(warmup_steps)' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL's schedule is not tf-models' cosine from step 0 with the warmup on top (cosineFromStep0) — re-emit"; ok=1; }
  grep -q '^GRAD_ACCUM = 8$' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL is not the 512 × 8 accumulation trainer"; ok=1; }
  grep -q '^    LR = 0.004000' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL is not at the paper's 0.004"; ok=1; }
  grep -q 'DT = jnp.float32; CONV_DT = jnp.float32   # evalF32' "jax/$PY_REL" || {
    echo "⛔ jax/$PY_REL scores through its bf16 training forward, not f32 (evalF32)"; ok=1; }
  grep -q '^    EPOCHS = 100$' "jax/$PY_REL" || { echo "⛔ jax/$PY_REL is not the 100-epoch trainer (full100)"; ok=1; }
  pc_gpu_idle || ok=1
  return $ok
}
